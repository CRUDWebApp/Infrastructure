name: Destroy CDK
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    
jobs:
  
  Destroy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for AWS OIDC authentication
      contents: read    # Required to clone the repository
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
            version: 11
            cache: true
            cache_dependency_path: ./infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./infrastructure
        run: pnpm install --frozen-lockfile

      - name: Setting public key for EC2Stack
        working-directory: ./infrastructure
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > ec2-key.pub

      - name: Build (Typescript compiler)
        working-directory: ./infrastructure
        run: pnpm build

      - name: Destroy CDK
        working-directory: ./infrastructure
        run: |
          EKS_OUT=$(aws cloudformation describe-stacks --stack-name EKSStack --query "Stacks[0].Outputs" --output json)
          CLUSTER_NAME=$(echo "$EKS_OUT" | jq -r '.[] | select(.OutputKey | contains("ClusterName")) | .OutputValue')
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME"
          echo "Deleting k8s resources..."
          kubectl delete svc crud-app-service
          kubectl delete deployment api-deployment
          kubectl delete job prisma-migrate --ignore-not-found
          kubectl delete secret backend-secret ecr-secret --ignore-not-found

          echo "Waiting for Load Balancer to be deleted..."
          while [ "$(aws elb describe-load-balancers --region us-east-1 \
            --query 'LoadBalancerDescriptions[?VPCId==`vpc-049bb3c340812237a`].LoadBalancerName' \
            --output text)" != "" ]; do
            echo "  still waiting..."
            sleep 10
          done
          pnpm cdk destroy --all --force